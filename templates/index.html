<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages</title>
<style>
  :root {
    --blue: #0b84fe;
    --gray-bubble: #e9e9eb;
    --bg: #f2f2f7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  .phone {
    width: 390px;
    max-width: 100vw;
    height: 844px;
    max-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 10px solid #111;
    border-radius: 40px;
  }
  .notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 150px; height: 25px;
    background: #111;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    z-index: 10;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 24px 2px;
    font-size: 13px;
    font-weight: 600;
    color: #000;
    flex-shrink: 0;
  }
  .nav-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 12px 10px;
    border-bottom: 1px solid #d1d1d6;
    flex-shrink: 0;
    background: var(--bg);
  }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #a9adb4;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .contact-name {
    font-size: 12px;
    color: #3c3c43;
  }
  #who-bar {
    text-align: center;
    font-size: 11px;
    color: #8e8e93;
    padding: 4px;
    flex-shrink: 0;
  }
  #who-bar select {
    font-size: 11px;
    border: none;
    background: transparent;
    color: var(--blue);
    font-weight: 600;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .row {
    display: flex;
    margin-bottom: 6px;
  }
  .row.me { justify-content: flex-end; }
  .row.them { justify-content: flex-start; }
  .bubble {
    max-width: 75%;
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.3;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .row.me .bubble {
    background: var(--blue);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.them .bubble {
    background: var(--gray-bubble);
    color: #000;
    border-bottom-left-radius: 4px;
  }
  .timestamp {
    text-align: center;
    font-size: 11px;
    color: #8e8e93;
    margin: 10px 0 4px;
  }
  .input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid #d1d1d6;
    background: var(--bg);
    flex-shrink: 0;
  }
  #text-input {
    flex: 1;
    border: 1px solid #c7c7cc;
    border-radius: 18px;
    padding: 8px 14px;
    font-size: 15px;
    outline: none;
    background: #fff;
    resize: none;
    max-height: 90px;
    font-family: inherit;
  }
  #send-btn {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:disabled { background: #c7c7cc; cursor: default; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <span>●●● 📶 🔋</span>
  </div>
  <div class="nav-bar">
    <div class="avatar" id="contact-initial">?</div>
    <div class="contact-name" id="contact-name">&nbsp;</div>
  </div>
  <div id="who-bar">
    You are:
    <select id="who-select"></select>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-bar">
    <textarea id="text-input" rows="1" placeholder="iMessage"></textarea>
    <button id="send-btn">&uarr;</button>
  </div>
</div>

<script>
let me = localStorage.getItem('chatUser') || '';
let participants = [];
let lastID = 0;
let pollTimer = null;

const whoSelect = document.getElementById('who-select');
const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const contactName = document.getElementById('contact-name');
const contactInitial = document.getElementById('contact-initial');

function other() {
  return participants.find(p => p !== me) || '';
}

function updateHeader() {
  const o = other();
  contactName.textContent = o;
  contactInitial.textContent = o ? o[0].toUpperCase() : '?';
}

function renderClock() {
  const d = new Date();
  const h = d.getHours() % 12 || 12;
  const m = String(d.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ':' + m;
}
renderClock();
setInterval(renderClock, 30000);

function appendMessage(msg) {
  const row = document.createElement('div');
  row.className = 'row ' + (msg.sender === me ? 'me' : 'them');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = msg.text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  lastID = Math.max(lastID, msg.id);
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadParticipants() {
  const res = await fetch('/api/participants');
  participants = await res.json();
  whoSelect.innerHTML = '';
  for (const p of participants) {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    whoSelect.appendChild(opt);
  }
  if (!participants.includes(me)) me = participants[0];
  whoSelect.value = me;
  updateHeader();
}

whoSelect.addEventListener('change', () => {
  me = whoSelect.value;
  localStorage.setItem('chatUser', me);
  messagesEl.innerHTML = '';
  lastID = 0;
  updateHeader();
  poll();
});

async function poll() {
  try {
    const res = await fetch('/api/messages?since=' + lastID);
    const msgs = await res.json();
    if (msgs.length) {
      const wasAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 20;
      for (const m of msgs) appendMessage(m);
      if (wasAtBottom) scrollToBottom();
    }
  } catch (e) {
    console.error('poll failed', e);
  }
}

async function send() {
  const text = textInput.value.trim();
  if (!text || !me) return;
  textInput.value = '';
  textInput.style.height = 'auto';
  sendBtn.disabled = true;
  try {
    await fetch('/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: me, text: text }),
    });
    await poll();
    scrollToBottom();
  } catch (e) {
    console.error('send failed', e);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', send);
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = textInput.scrollHeight + 'px';
});

(async function init() {
  await loadParticipants();
  await poll();
  scrollToBottom();
  pollTimer = setInterval(poll, 1500);
})();
</script>
</body>
</html>
